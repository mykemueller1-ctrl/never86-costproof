name: CostProof checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run application checks
        run: node --experimental-transform-types --test test/*.test.mjs

      - name: Replay complete synthetic shift
        run: node --experimental-transform-types src/sample-run.mjs --scenario complete --output-dir .costproof/samples/ci-complete

      - name: Replay missing wages
        run: node --experimental-transform-types src/sample-run.mjs --scenario missing-wages --output-dir .costproof/samples/ci-missing-wages

      - name: Replay restaurant mismatch
        run: node --experimental-transform-types src/sample-run.mjs --scenario mismatched-restaurant --output-dir .costproof/samples/ci-mismatched-restaurant
